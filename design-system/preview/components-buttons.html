<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhonen Components</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="preview.css"><style>.library{display:grid;grid-template-columns:3fr 9fr}.name,.demo{padding:32px;border-bottom:1px solid var(--fg)}.name{border-right:1px solid var(--fg)}.demo{display:flex;flex-wrap:wrap;align-items:center;gap:16px}.btn{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:14px 20px;border:1px solid var(--fg);border-radius:0;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-decoration:none;text-transform:uppercase;transition:transform 140ms var(--ease-out),background 140ms var(--ease-out),color 140ms var(--ease-out)}.primary{border-color:var(--accent);background:var(--accent);color:var(--bg)}.primary:hover{border-color:var(--fg);background:var(--fg);color:var(--bg);transform:translateY(-2px)}.secondary{background:var(--bg);color:var(--fg)}.secondary:hover{background:var(--fg);color:var(--bg);transform:translateY(-2px)}.text{min-height:44px;color:var(--fg);font-size:.75rem;font-weight:600;letter-spacing:.08em;text-underline-offset:6px;text-transform:uppercase}.field{width:min(100%,30rem);min-height:48px;padding:12px 14px;border:1px solid var(--fg);border-radius:0;background:var(--surface);color:var(--fg)}.chip{display:inline-flex;min-height:44px;align-items:center;padding:8px 12px;border:1px solid var(--fg);font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.selected{background:var(--signal)}@media(max-width:640px){.library{grid-template-columns:1fr}.name{border-right:0}}</style></head><body><main class="preview-shell" data-od-id="component-preview"><header class="preview-head"><div class="preview-coordinate"><p class="label">Preview 05 · Components</p></div><div class="preview-title"><h1>One action, clear states.</h1><p>Controls are square, full-contrast, keyboard-visible, and at least 44 pixels tall.</p></div></header><section class="library"><div class="name"><p class="label">Buttons</p></div><div class="demo"><a class="btn primary" href="#work">See selected work</a><a class="btn secondary" href="#story">Read my story</a><a class="text" href="#experience">View experience →</a></div><div class="name"><p class="label">Field</p></div><div class="demo"><input class="field" aria-label="Email address" type="email" placeholder="you@example.com"></div><div class="name"><p class="label">Tags</p></div><div class="demo"><span class="chip selected">Product design</span><span class="chip">TypeScript</span><span class="chip">Operations</span></div></section></main></body></html>
