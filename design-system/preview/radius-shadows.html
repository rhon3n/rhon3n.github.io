<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhonen Radius and Shadows</title><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="preview.css"><style>.examples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px}.specimen{display:flex;min-height:280px;flex-direction:column;justify-content:space-between;padding:32px;border:1px solid var(--fg);border-radius:0;background:var(--surface)}.tactile{cursor:pointer;transition:transform 140ms var(--ease-out),box-shadow 140ms var(--ease-out),background 140ms var(--ease-out),color 140ms var(--ease-out)}.tactile:hover,.tactile:focus-visible{background:var(--signal);box-shadow:var(--shadow-tactile);transform:translate(-4px,-4px)}.value{font-family:var(--font-display);font-size:clamp(2.5rem,6vw,5rem);font-weight:400;line-height:.92;text-transform:uppercase}@media(max-width:640px){.examples{grid-template-columns:1fr}}</style></head><body><main class="preview-shell" data-od-id="radius-shadow-preview"><header class="preview-head"><div class="preview-coordinate"><p class="label">Preview 04 · Shape</p></div><div class="preview-title"><h1>Flat at rest.</h1><p>Square geometry is permanent. A hard offset appears only as tactile feedback, never as ambient decoration.</p></div></header><section class="preview-stage examples"><article class="specimen"><p class="label">Radius · Rest</p><strong class="value">0px</strong><span class="mono">No soft corners</span></article><button class="specimen tactile" type="button"><span class="label">Shadow · Hover / focus</span><strong class="value">4 × 4</strong><span class="mono">var(--shadow-tactile)</span></button></section></main></body></html>
